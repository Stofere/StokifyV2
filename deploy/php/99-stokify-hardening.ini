; Salin ke: /etc/php/8.4/fpm/conf.d/99-stokify-hardening.ini   (hanya PHP-FPM / web; CLI tidak terpengaruh)
; Lalu: sudo systemctl restart php8.4-fpm
;
; Batas upload (5M / 16M) dan memory_limit TIDAK di sini: CloudPanel mengirimnya lewat
; "PHP Settings" situs pada setiap request, sehingga nilai di file ini akan tertimpa.

; Mitigasi parsial CVE-2026-109619 (PHP2Shell). Laravel tidak memakai fitur ini.
; Harus di php.ini / conf.d, jangan mengandalkan .user.ini.
session.upload_progress.enabled = 0

; Jangan umumkan versi PHP di header X-Powered-By
expose_php = Off

; Fungsi untuk menjalankan perintah OS. Aplikasi (dan paket PDF/Excel/gambar) tidak memakainya
; saat melayani web, jadi webshell yang sempat tertanam pun tidak bisa menjalankan perintah server.
; PERIKSA DULU: php-fpm8.4 -i | grep disable_functions  -> jika sudah ada isinya, gabungkan.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
