# Salin ke: /etc/nginx/conf.d/stokify-limits.conf   (level "http", dimuat otomatis oleh nginx.conf)
# Zona batas permintaan per IP, dipakai oleh vhost (lihat cloudpanel-vhost.conf).

# Semua request yang diteruskan ke PHP: 10/detik per IP (burst diatur di vhost)
limit_req_zone $binary_remote_addr zone=stokify_php:10m rate=10r/s;

# Endpoint upload Livewire: 20/menit per IP
limit_req_zone $binary_remote_addr zone=stokify_upload:10m rate=20r/m;
