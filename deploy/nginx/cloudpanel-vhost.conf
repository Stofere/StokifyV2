server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.stokifywsm.web.id;
  return 301 https://stokifywsm.web.id$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name stokifywsm.web.id www1.stokifywsm.web.id;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # ===== STOKIFY: mulai (lihat docs/keamanan-php2shell-dan-upload.md) =====
  # Butuh /etc/nginx/conf.d/stokify-limits.conf (zona stokify_php & stokify_upload)
  server_tokens off;
  limit_req_status 429;
  # Request biasa (JSON Livewire, form login) tidak butuh body besar
  client_max_body_size 2m;

  # File tersembunyi (.env, .git, .htaccess, .user.ini)
  location ~ /\.(?!well-known) {
    deny all;
  }

  # Folder upload: hanya gambar, disajikan statis di sini, TIDAK PERNAH diteruskan ke PHP.
  # "^~" membuat blok regex lain tidak dicek untuk /storage/.
  location ^~ /storage/ {
    location ~* \.(jpe?g|png|webp|gif|bmp|svg)$ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
      expires 30d;
      access_log off;
      try_files $uri =404;
    }
    return 404;
  }

  # Endpoint upload Livewire: SATU-SATUNYA tempat upload file (multipart) diterima.
  # Regex wajib diberi tanda kutip karena mengandung kurung kurawal {8}.
  location ~ "^/livewire-[0-9a-f]{8}/upload-file$" {
    client_max_body_size 16m;
    limit_req zone=stokify_upload burst=10 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;
    proxy_read_timeout 120;
  }
  # ===== STOKIFY: selesai =====

  location / {
    # STOKIFY: tolak upload file (multipart) di luar endpoint upload, dan batasi request per IP
    if ($content_type ~* "multipart/form-data") {
      return 415;
    }
    limit_req zone=stokify_php burst=50 nodelay;

    {{varnish_proxy_pass}}
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name stokifywsm.web.id www1.stokifywsm.web.id;
  {{root}}

  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  # STOKIFY: SATU-SATUNYA file PHP yang boleh dijalankan
  location = /index.php {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  # STOKIFY: file .php lain di mana pun (mis. webshell yang sempat tertanam) tidak dijalankan
  location ~ \.php$ {
    return 404;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}
